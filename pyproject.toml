[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-submission-compiler"
version = "0.1.0"
description = "Compile semantic academic Markdown into journal-specific DOCX submissions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Academic Submission Compiler contributors" }]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
intake = ["beautifulsoup4>=4.12,<5", "pdfplumber>=0.11,<1"]
dev = ["pytest>=8,<9", "Pillow>=10,<13"]

[project.scripts]
asc = "asc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
